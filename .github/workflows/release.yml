name: Release APK

on:
  push:
    tags:
      - 'v*'          # triggered by tags like v2.1.5, v2.2.0, etc.

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_JSON }}' | base64 --decode > app/google-services.json

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            > ⚠️ This APK is unsigned. Enable "Install from unknown sources" on your device to install it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
